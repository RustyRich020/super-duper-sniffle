name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      AZURE_CLIENT_SECRET: ci-build-placeholder
      AZURE_TENANT_ID: 00000000-0000-0000-0000-000000000000
      NEXTAUTH_SECRET: ci-only-placeholder-secret-not-used-outside-tests
      NEXTAUTH_URL: http://localhost:3000
      WORKSPACE_ALLOWED_APP_ROLES: Workspace.Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Smoke test (boot + HTTP 200 on /)
        run: |
          npm run start &
          SERVER_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null; then ok=1; break; fi
            sleep 2
          done
          kill $SERVER_PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "Smoke test failed: app did not return 200 on /"; exit 1; fi
          echo "Smoke test passed."
